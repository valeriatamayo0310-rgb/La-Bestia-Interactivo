<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El viaje de La Bestia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ABeeZee&family=Fjalla+One&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f0f28;--gold:#f0b84f;--cream:#fff3d6;--ink:#2a1c14;--orange:#e2702b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--navy);display:grid;place-items:center;overflow:hidden;font-family:'ABeeZee',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#stage{position:relative;width:min(100vw,150vh);aspect-ratio:3/2;container-type:inline-size;overflow:hidden;background:var(--navy);user-select:none}
.fj{font-family:'Fjalla One',Impact,sans-serif;font-weight:400}
/* portada */
#intro{position:absolute;inset:0;z-index:20;background:var(--navy);transition:opacity .9s ease;text-align:center}
#intro.hide{opacity:0;pointer-events:none}
#intro .bg{position:absolute;left:0;top:10%;width:100%;height:100%}
#intro h1{position:absolute;left:0;right:0;top:7%;margin:0;font-size:7.4cqw;color:var(--gold);letter-spacing:.04cqw}
#intro p{position:absolute;left:20%;right:20%;margin:0;color:#f6e3b4;font-size:2.3cqw;line-height:1.35}
#intro .p1{top:27%}#intro .p2{top:40%;font-size:2cqw}
#go{position:absolute;left:50%;top:56%;transform:translateX(-50%);border:0;cursor:pointer;background:var(--orange);color:var(--cream);font-size:2.6cqw;padding:1cqw 3.6cqw;border-radius:2cqw;box-shadow:0 .6cqw 0 #a84a14}
#go:active{transform:translateX(-50%) translateY(.3cqw);box-shadow:0 .3cqw 0 #a84a14}
/* escena */
#strip{position:absolute;left:0;top:0;width:400%;height:100%;display:flex;transition:transform 2.4s cubic-bezier(.65,0,.35,1)}
#strip img{width:25%;height:100%;object-fit:cover;display:block}
#strip img:first-child{object-position:center bottom}
#train{position:absolute;left:3%;width:94%;bottom:22.5%;transform-origin:50% 100%;animation:bob 1s ease-in-out infinite alternate}
#train.moving{animation:rumble .22s linear infinite alternate}
@keyframes bob{from{transform:translateY(0) rotate(0)}to{transform:translateY(-.22cqw) rotate(.12deg)}}
@keyframes rumble{from{transform:translate(-.12cqw,0) rotate(-.1deg)}to{transform:translate(.12cqw,-.28cqw) rotate(.1deg)}}
#cars{position:relative;display:flex}
#cars>img{width:50%;display:block}
.ch{position:absolute;bottom:92%;border:0;padding:0;background:none;cursor:pointer;transition:opacity .7s ease,transform .25s ease,filter .25s ease}
.ch img{width:100%;display:block;pointer-events:none}
.sel .ch:hover,.sel .ch:focus-visible{transform:translateY(-1cqw);filter:drop-shadow(0 0 .7cqw #fff3d6);outline:none}
.story .ch{cursor:default;pointer-events:none}
.story .ch:not(.on){opacity:0}
#sand{position:absolute;pointer-events:none}
/* globos */
#bubbles{position:absolute;inset:0;pointer-events:none}
.b{box-sizing:border-box;position:absolute;background:var(--cream);color:var(--ink);border:.35cqw solid var(--orange);border-radius:2cqw;padding:1.2cqw 1.9cqw;font-size:1.75cqw;line-height:1.38;box-shadow:0 .6cqw 0 rgba(15,15,40,.38);opacity:0;transform:translateY(1.2cqw) scale(.97);animation:pop .55s cubic-bezier(.2,.9,.3,1.2) forwards}
.b.out{animation:none;opacity:0;transition:opacity .3s}
.b::after{content:"";position:absolute;left:var(--tx,12%);bottom:-1.7cqw;border:1cqw solid transparent;border-top:1.2cqw solid var(--orange);border-bottom:0;margin-left:-1cqw}
.b.nt::after{display:none}
.b.t{font-family:'Fjalla One',Impact,sans-serif;font-size:2.6cqw;text-align:center;padding:1.1cqw 2.2cqw}
.b.ctr{text-align:center}
.b button{pointer-events:auto;margin-top:1.2cqw;border:0;cursor:pointer;background:var(--orange);color:var(--cream);font-family:'Fjalla One',Impact,sans-serif;font-size:2.4cqw;padding:.8cqw 2.6cqw;border-radius:2cqw;box-shadow:0 .5cqw 0 #a84a14}
@keyframes pop{to{opacity:1;transform:none}}
/* interfaz */
#ui{position:absolute;left:0;right:0;bottom:1.6cqw;display:flex;justify-content:center;gap:1.2cqw;align-items:center;pointer-events:none;opacity:0;transition:opacity .6s}
#ui.on{opacity:1}
#ui .pill{background:rgba(15,15,40,.78);color:var(--cream);border-radius:2cqw;padding:.7cqw 1.8cqw;font-size:1.7cqw;display:flex;align-items:center;gap:1cqw}
#dots{display:flex;gap:.7cqw}
#dots i{width:1cqw;height:1cqw;border-radius:50%;background:#7b7aa8}
#dots i.on{background:var(--gold)}
#back{position:absolute;left:1.6cqw;bottom:1.6cqw;z-index:10;border:0;cursor:pointer;background:var(--orange);color:var(--cream);font-size:1.9cqw;padding:.7cqw 2cqw;border-radius:2cqw;box-shadow:0 .4cqw 0 #a84a14}
#back[hidden]{display:none}
#rot{display:none}
@media (orientation:portrait) and (max-width:600px){#rot{display:grid;position:fixed;inset:0;z-index:99;place-items:center;background:var(--navy);color:var(--cream);text-align:center;padding:2rem;font-size:1.3rem}}
@media (prefers-reduced-motion:reduce){#train,#train.moving{animation:none}#strip{transition-duration:.5s}}
</style>
</head>
<body>
<div id="rot"><div><div class="fj" style="font-size:2rem;color:var(--gold);margin-bottom:.6rem">El viaje de La Bestia</div>Gira tu celular en horizontal para vivir la experiencia.</div></div>
<div id="stage">
  <div id="strip"><img data-i="bg0" alt=""><img data-i="bg1" alt=""><img data-i="bg2" alt=""><img data-i="bg3" alt=""></div>
  <div id="train"><div id="cars"><img data-i="car" alt="Vagón de La Bestia"><img data-i="car" alt="" aria-hidden="true"></div></div>
  <div id="bubbles"></div>
  <div id="ui"><div class="pill"><span id="dots"></span><span>Toca la pantalla para continuar</span></div></div>
  <button id="back" class="fj" hidden>Volver a los personajes</button>
  <div id="intro">
    <img class="bg" data-i="intro" alt="">
    <h1 class="fj">El viaje de La Bestia</h1>
    <p class="p1">Explora el trayecto y descubre los datos, riesgos y apoyos que dejan huella en este viaje</p>
    <p class="p2">Selecciona a un personaje y descubre cómo empieza y termina su trayecto</p>
    <button id="go" class="fj">Comenzar</button>
  </div>
</div>

 {k:'c4',l:2,w:9,n:'Hombre de camisa rayada',end:FIN,f:[
  'Él avanzó durante días pensando que cada tramo lo acercaba un poco más a su destino.',
  'Pero en la última parte del recorrido, el riesgo cambia: el cansancio, la falta de agua, las condiciones extremas y la violencia pueden convertir el camino en algo todavía más incierto.',
  'Algunas personas logran continuar. Otras desaparecen del recorrido y dejan de ser visibles para quienes intentan seguir su historia.',
  'Cuando eso ocurre, detrás queda una familia esperando una llamada, una noticia o cualquier señal que permita saber qué pasó.',
  'Su historia cierra el recorrido recordando que no todos los viajes tienen una llegada. Algunas trayectorias terminan en ausencia, y muchas veces esa ausencia es también difícil de registrar y cuantificar.']},
 {k:'c2',l:13,w:11.5,n:'Mujer con su hijo',end:FIN,f:[
  'Ella viaja con su hijo. No emprendieron el camino solos: como muchas mujeres registradas por REDODEM, avanzan acompañadas por su familia.',
  'Durante el recorrido, cada decisión se toma pensando en dos. Dónde descansar, cuándo avanzar o cuándo detenerse depende también de mantenerlo seguro.',
  'Viajar en familia puede significar compañía y apoyo, pero también una responsabilidad constante frente al cansancio, el miedo y los riesgos del trayecto.',
  'En cada parada, ella no solo busca comida, descanso o una forma de continuar; también busca proteger a su hijo mientras el camino sigue cambiando.',
  'Su historia representa una parte importante de la migración: para muchas personas, el viaje no se vive de manera individual, sino junto a quienes intentan cuidar mientras avanzan hacia el mismo destino.']},
 {k:'c3',l:27,w:10.5,n:'Mujer con una bolsa',end:FIN,f:[
  'Ella comenzó el recorrido con poco dinero y la idea de avanzar lo más rápido posible, pero pronto entendió que llegar también cuesta.',
  'En cada país o ciudad de paso, el dinero se acaba en comida, transporte, alojamiento o cualquier necesidad inesperada.',
  'Para continuar, empieza a vender pequeños objetos o trabajar de manera ambulante mientras reúne lo suficiente para el siguiente tramo.',
  'Cada pausa para trabajar retrasa el viaje, pero también hace posible seguir. Avanzar depende tanto de resistir el camino como de conseguir recursos para sostenerlo.',
  'Su historia representa una realidad común del tránsito migrante: el viaje no solo exige voluntad, también tiempo, dinero y la capacidad de encontrar formas de sobrevivir mientras se continúa hacia el destino.']},
 {k:'c5',l:51,w:15,n:'Hombre de camisa naranja',end:FIN,f:[
  'Durante el recorrido, él descubre que no todas las comunidades reaccionan de la misma manera ante su presencia.',
  'Las patronas y otras personas ayudan ofreciendo agua, comida o un lugar donde descansar; otras lo miran con desconfianza y prefieren que siga su camino cuanto antes. En Veracruz, dicen que es más peligroso, porque los apedrean y maltratan.',
  'Su historia muestra que el paso migrante también depende de la mirada de quienes lo reciben: una misma comunidad puede convertirse en apoyo, rechazo o ambas cosas al mismo tiempo.']},
 {k:'c1',l:68,w:14,n:'Stephanie y Susej',end:'Su recorrido terminó en México.',f:[
  'Stephanie y Susej salieron de Venezuela buscando nuevas oportunidades y la posibilidad de construir una vida distinta lejos de su país.',
  'Al llegar a México, su historia se cruzó con una presunta red vinculada al Tren de Aragua, organización que ha extendido sus operaciones hacia otros territorios mediante alianzas y redes criminales.',
  'En Ciudad de México, investigaciones sobre el caso señalaron que ambas habrían sido víctimas de explotación sexual y de mecanismos de control utilizados para marcar pertenencia y sometimiento.',
  'Entre esos mecanismos, distintos reportes mencionaron tatuajes utilizados como una forma de identificación y control sobre las mujeres dentro de estas redes.',
  'Sus asesinatos en julio de 2024 hicieron visible una realidad que suele quedar detrás de las cifras: la vulnerabilidad de mujeres migrantes que, mientras buscan una nueva oportunidad, pueden quedar expuestas a explotación, violencia y redes criminales.']},
 {k:'c0',l:84,w:12,n:'Mateo, niño con mapa',end:FIN,f:[
  'En Tapachula comienza todo: Mateo inicia su recorrido desde el sur con miedo, pero también con la ilusión de encontrar una vida mejor.',
  'Al llegar a Ixtepec, encuentra una pausa necesaria en el camino, donde puede descansar, conseguir provisiones y recuperar fuerzas para continuar.',
  'En Coatzacoalcos, el viaje sigue entre la espera y la incertidumbre, porque cada parada puede cambiar el ritmo y también el rumbo del recorrido.',
  'Cuando pasa por Puebla, el cansancio ya pesa más en el cuerpo y en la mente, y cada decisión se vuelve más difícil, aunque avanzar siga siendo la única opción.',
  'En Los Mochis, el norte se siente más cercano, pero el trayecto continúa siendo duro y cada paso exige resistencia, paciencia y esperanza.',
  'Al llegar a Nogales, la frontera aparece como uno de los momentos más decisivos del viaje, concentrando todo el peso de lo vivido y la esperanza de finalmente llegar.']}
];
const S={
 c0:'En julio de 2023, la OIM realizó en Tapachula 307 encuestas que representaban a 588 personas dentro de grupos familiares, mostrando la importancia de este punto dentro del tránsito por la frontera sur.',
 c1:'Stephanie y Susej eran 2 jóvenes venezolanas cuyos cuerpos fueron encontrados el 30 de julio de 2024 en Topilejo, Ciudad de México. Su caso hizo visible la vulnerabilidad de mujeres migrantes frente a redes de violencia y explotación.',
 c2:'En los registros de REDODEM, 81.8% de las mujeres viajaba con familia. En contraste, entre los hombres 41.5% viajaba solo y 39.7% con familia.',
 c3:'En un monitoreo de la OIM en Tapachula, 89% de las mujeres y 95% de los hombres encuestados no tenían acceso a actividades generadoras de ingreso. Entre las principales dificultades estaban haber llegado recientemente y no contar con permisos laborales.',
 c4:'Durante 2023 se documentaron 628 muertes y desapariciones de personas migrantes en la frontera entre México y Estados Unidos. El 25% estuvo relacionado con condiciones ambientales extremas y en 19% de los casos la causa quedó sin determinar.',
 c5:'REDODEM obtiene información mediante una red de 23 albergues socios en México y documenta el tránsito migrante desde 2013. Estos espacios representan parte de la infraestructura comunitaria que recibe, acompaña y registra a personas durante el recorrido.'};
const GEO={"c0": [0.0188, 0.9595], "c1": [0.0315, 0.8473], "c2": [0.0209, 0.9876], "c3": [0.0647, 1.005], "c4": [0.0227, 1.3266], "c5": [0.0288, 0.7002]},SINK=.07,EX={c0:.03,c1:.045,c2:.045,c4:.09};
const $=s=>document.querySelector(s),stage=$('#stage'),strip=$('#strip'),train=$('#train'),cars=$('#cars'),bub=$('#bubbles'),ui=$('#ui'),dots=$('#dots'),back=$('#back');
let state='intro',cur=null,idx=0,bg=0,busy=false,timers=[],run=0;
const later=(f,ms)=>{const t=setTimeout(f,ms);timers.push(t);return t};
const clear=()=>{timers.forEach(clearTimeout);timers=[];run++};
CH.forEach(c=>{const b=document.createElement('button');b.className='ch';b.style.left=c.l+'%';b.style.width=c.w+'%';b.setAttribute('aria-label',c.n);b.innerHTML='<img alt="">';b.firstChild.src=IMG[c.k];
 b.onclick=e=>{e.stopPropagation();if(state==='select')choose(CH.indexOf(c))};cars.appendChild(b);c.el=b});
/* asienta a cada personaje sobre el techo (compensa el margen transparente de su PNG) */
function layout(){CH.forEach(c=>{const g=GEO[c.k],eh=c.w/100*cars.offsetWidth*g[1];c.el.style.bottom=(cars.offsetHeight*(1-SINK-(EX[c.k]||0))-g[0]*eh)+'px'})}
new ResizeObserver(layout).observe(cars);
/* globos: arriba, sin cubrir al personaje; la colita apunta hacia él */
function say(parts,o={}){
  bub.querySelectorAll('.b').forEach(x=>{x.classList.add('out');setTimeout(()=>x.remove(),320)});
  const cx=cur==null?50:3+(CH[cur].l+CH[cur].w/2)*.94;
  const mk=(t,l,w,top,d,tail,cls)=>{const e=document.createElement('div');e.className='b'+(tail?'':' nt')+(cls?' '+cls:'');e.style.cssText='left:'+l+'%;width:'+w+'%;top:'+top+'%;animation-delay:'+d+'s;--tx:'+Math.max(8,Math.min(92,(cx-l)/w*100))+'%';e.textContent=t;bub.appendChild(e);return e};
  if(o.title){mk(o.title,22,56,9,.05,0,'t');return}
  if(!parts.length)return;
  if(parts.length===1){const w=o.w||50,e=mk(parts[0],Math.max(3,Math.min(97-w,cx-w/2)),w,9,.05,1,o.btn?'ctr':'');
    if(o.btn){e.appendChild(document.createElement('br'));const b=document.createElement('button');b.textContent='Elegir otro personaje';b.onclick=ev=>{ev.stopPropagation();reset()};e.appendChild(b)}return}
  const left=cx<50;mk(parts[0],3,45,8,.05,left);mk(parts[1],52,45,12,.5,!left);
}
function split(t){
  if(t.length<165)return[t];
  const m=t.length/2;let best=-1,bd=1e9;
  for(const r of t.matchAll(/[,;:.] /g)){const d=Math.abs(r.index-m);if(r.index>t.length*.3&&r.index<t.length*.7&&d<bd){bd=d;best=r.index+2}}
  if(best<0)best=t.indexOf(' ',m);
  return[t.slice(0,best).trim(),t.slice(best).trim()];
}
function goBg(i){bg=i;strip.style.transform='translateX('+(-25*i)+'%)';train.classList.add('moving');later(()=>train.classList.remove('moving'),2400)}
const pickBg=(i,n)=>n<2?0:Math.round(i*3/(n-1));
function show(i){
  const c=CH[cur],nb=pickBg(i,c.f.length);
  dots.querySelectorAll('i').forEach((d,k)=>d.classList.toggle('on',k===i));
  if(nb!==bg){busy=true;bub.querySelectorAll('.b').forEach(x=>x.classList.add('out'));goBg(nb);later(()=>{say(split(c.f[i]));busy=false},1900)}
  else say(split(c.f[i]));
}
function menu(){stage.className='sel';back.hidden=true;ui.classList.remove('on');state='select';say([],{title:'Toca a un personaje para empezar su recorrido'})}
function choose(i){
  cur=i;idx=0;state='story';stage.className='story';back.hidden=false;
  CH.forEach((c,k)=>c.el.classList.toggle('on',k===i));
  dots.innerHTML=CH[i].f.map(()=>'<i></i>').join('');ui.classList.add('on');
  say([]);busy=true;later(()=>{busy=false;show(0)},650);
}
function advance(){
  if(state==='sandread'){closing();return}
  if(state!=='story'||busy)return;
  if(idx<CH[cur].f.length-1){idx++;show(idx)}else sandEnd();
}
stage.addEventListener('click',advance);
addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&(state==='story'||state==='sandread')){e.preventDefault();advance()}});
$('#go').onclick=e=>{e.stopPropagation();$('#intro').classList.add('hide');later(menu,500)};
back.onclick=e=>{e.stopPropagation();reset()};
function reset(){
  clear();bub.querySelectorAll('.b').forEach(x=>x.remove());const cv=$('#sand');if(cv)cv.remove();
  CH.forEach(c=>c.el.classList.remove('on'));back.hidden=true;ui.classList.remove('on');busy=false;state='wait';cur=null;
  if(bg!==0){goBg(0);later(menu,2200)}else menu();
}
/* final: dato + arena + cierre */
function sandEnd(){
  state='sand';ui.classList.remove('on');const my=run;say([]);
  later(()=>say(split(S[CH[cur].k])),700);
  sand(my,()=>{if(my!==run)return;state='sandread';ui.classList.add('on')});
}
function closing(){if(state!=='sandread')return;state='end';ui.classList.remove('on');say([CH[cur].end],{w:46,btn:1})}
/* arena: toma la forma del propio personaje (silueta engrosada + montículo) y sube desde el techo */
function sand(my,cb){
  const k=CH[cur].k,ch=CH[cur].el,im=ch.firstChild,w=ch.offsetWidth,h=ch.offsetHeight,m=Math.round(w*.3),R=w*.085;
  const cw=w+2*m,chh=h+m*1.4,dpr=Math.min(2,devicePixelRatio||1),yb=m+h*(1-GEO[k][0]),sd=Math.random()*50;
  const cv=document.createElement('canvas');cv.id='sand';
  cv.style.cssText='left:'+(ch.offsetLeft-m)+'px;top:'+(ch.offsetTop-m)+'px;width:'+cw+'px;height:'+chh+'px';
  cv.width=cw*dpr;cv.height=chh*dpr;cars.appendChild(cv);
  const mk=()=>{const c=document.createElement('canvas');c.width=cv.width;c.height=cv.height;const x=c.getContext('2d');x.scale(dpr,dpr);return[c,x]};
  const[sc,sx]=mk();sx.drawImage(im,m,m,w,h);sx.globalCompositeOperation='source-in';sx.fillStyle='#000';sx.fillRect(0,0,cw,chh);
  const[Sh,X]=mk(),ring=(x,src,r,n)=>{for(let a=0;a<n;a++){const g=a/n*6.283,q=r*(.65+.35*Math.abs(Math.sin(a*2.3+sd)));x.drawImage(src,0,0,cv.width,cv.height,Math.cos(g)*q,Math.sin(g)*q,cw,chh)}};
  ring(X,sc,R,30);ring(X,sc,R*.55,20);X.drawImage(sc,0,0,cv.width,cv.height,0,0,cw,chh);
  X.beginPath();X.ellipse(cw/2,yb,w*.6,h*.17,0,Math.PI,0);X.fill();
  const[Ol,Z]=mk();Z.drawImage(Sh,0,0,cw,chh);ring(Z,Sh,2.4,10);Z.globalCompositeOperation='source-in';Z.fillStyle='#a8731f';Z.fillRect(0,0,cw,chh);
  const[Oc,Ox]=mk(),[Y,Yx]=mk(),x=cv.getContext('2d');x.scale(dpr,dpr);
  const g=document.createElement('canvas');g.width=g.height=160;const gx=g.getContext('2d');gx.fillStyle='#ecb23e';gx.fillRect(0,0,160,160);
  const pal=['#c98a2a','#f6cf72','#d99a30','#fbe39a','#b87a22'];
  for(let q=0;q<2200;q++){gx.fillStyle=pal[q%5];gx.globalAlpha=.35+Math.random()*.5;gx.fillRect(Math.random()*160,Math.random()*160,1+Math.random()*1.8,1+Math.random()*1.8)}
  const pat=x.createPattern(g,'repeat'),gr=[],s=w/110;
  const top=m-R-h*.2,bot=yb+R*.5;
  const sy=(px,p)=>bot-(bot-top)*p+Math.sin(px*.09+sd)*h*.025*(1-p*.6)+Math.sin(px*.23+sd*2)*h*.012;
  const cut=(c,p,o)=>{c.save();c.globalCompositeOperation='destination-out';c.beginPath();c.moveTo(0,0);c.lineTo(cw,0);for(let px=cw;px>=0;px-=3)c.lineTo(px,sy(px,p)+o);c.closePath();c.fill();c.restore()};
  const D=matchMedia('(prefers-reduced-motion:reduce)').matches?1200:5200,t0=performance.now(),gx0=-(ch.offsetLeft-m),gx1=cars.offsetWidth+gx0;
  const gd=x.createLinearGradient(0,top,0,yb);gd.addColorStop(0,'#f3c45a');gd.addColorStop(1,'#d79a32');
  (function f(now){
    if(my!==run)return;
    const p0=Math.min(1,(now-t0)/D),p=p0<.5?2*p0*p0:1-Math.pow(-2*p0+2,2)/2;
    Yx.clearRect(0,0,cw,chh);Yx.globalCompositeOperation='source-over';Yx.drawImage(Sh,0,0,cw,chh);cut(Yx,p,0);
    Yx.globalCompositeOperation='source-in';Yx.fillStyle=gd;Yx.fillRect(0,0,cw,chh);
    Yx.globalCompositeOperation='source-atop';Yx.globalAlpha=.85;Yx.fillStyle=pat;Yx.fillRect(0,0,cw,chh);Yx.globalAlpha=1;Yx.globalCompositeOperation='source-over';
    Ox.clearRect(0,0,cw,chh);Ox.drawImage(Ol,0,0,cw,chh);cut(Ox,p,-2.4);
    x.clearRect(0,0,cw,chh);x.save();x.beginPath();x.rect(gx0,0,gx1-gx0,yb+1);x.clip();x.drawImage(Oc,0,0,cw,chh);x.drawImage(Y,0,0,cw,chh);
    if(p0<.92)for(let q=0;q<5;q++)gr.push({x:m*.6+Math.random()*(w+m*.8),y:-4,vx:(.8+Math.random()*1.2)*s,vy:(2.5+Math.random()*2.5)*s,c:pal[q%5]});
    for(let q=gr.length-1;q>=0;q--){const r=gr[q];r.x+=r.vx;r.y+=r.vy;if(r.y>=sy(r.x,p)){gr.splice(q,1);continue}x.fillStyle=r.c;x.fillRect(r.x,r.y,2.2*s,2.2*s)}
    x.restore();
    if(p0<1||gr.length)requestAnimationFrame(f);else cb();
  })(t0);
}
</script>
